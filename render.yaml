# render.yaml
services:
  - type: web
    name: task-and-time-tracking-app
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
    - key: SPRING_PROFILES_ACTIVE
      value: render
    healthCheckPath: /actuator/health

databases:
  - name: task-time-management-db
    plan: free
