version: '3.8'

services:
  app:
    image: task-tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:mysql://db:3306/task_tracker
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: password
    depends_on:
      - db
    networks:
      - task-tracker-network

  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: task_tracker
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    networks:
      - task-tracker-network

networks:
  task-tracker-network:
    driver: bridge

volumes:
  db_data:
    driver: local