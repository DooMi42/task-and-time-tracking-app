version: '3.8'

services:
  app:
    image: task-tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/task_tracker
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
    depends_on:
      - db
    networks:
      - task-tracker-network

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - task-tracker-network

networks:
  task-tracker-network:
    driver: bridge

volumes:
  db_data:
    driver: local
