# Render-specific configuration
# 1) Use the injected DATABASE_URL wholesale:
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PORT CONFIGURATION - CRITICAL FOR RENDER
server.port=${PORT:8080}

# Add this to handle non-JDBC formatted URLs
spring.datasource.hikari.connection-init-sql=SELECT 1

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enhanced logging for troubleshooting cloud deployment
logging.level.org.springframework=INFO
logging.level.com.tasktracker=DEBUG
logging.level.org.hibernate=INFO
logging.level.com.zaxxer.hikari=DEBUG

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=${JWT_SECRET:26ec369cd7ebc11901fa4b5adff6af84}
jwt.expiration=${JWT_EXPIRATION:86400}