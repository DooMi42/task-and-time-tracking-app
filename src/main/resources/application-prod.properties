# Database configuration for Render.com
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/task_tracker}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Temporarily disable Flyway until DB is properly connected
spring.flyway.enabled=false

# Port configuration - Render assigns PORT environment variable
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:26ec369cd7ebc11901fa4b5adff6af84}
jwt.expiration=3600

# Logging for troubleshooting
logging.level.org.springframework=INFO
logging.level.com.tasktracker=DEBUG
logging.level.org.hibernate.SQL=DEBUG