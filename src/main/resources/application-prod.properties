# Database configuration for Render.com
# Let Spring Boot and our config class handle DB connection
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Temporarily disable Flyway until DB is properly connected
spring.flyway.enabled=false

# Port configuration - Render assigns PORT environment variable
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:26ec369cd7ebc11901fa4b5adff6af84}
jwt.expiration=3600

# Logging for troubleshooting
logging.level.org.springframework=INFO
logging.level.com.tasktracker=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Allow bean overriding
spring.main.allow-bean-definition-overriding=true