# Database Configuration
spring.datasource.url=jdbc:postgresql://${JDBC_DATABASE_URL:localhost:5432/tasktracker}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:yourpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server port
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:your_jwt_secret}
jwt.expiration=${JWT_EXPIRATION:3600}

# Configure logging to troubleshoot
logging.level.org.springframework=INFO
logging.level.com.tasktracker=DEBUG
logging.level.org.hibernate.SQL=DEBUG