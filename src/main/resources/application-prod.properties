# Database configuration for Render.com
spring.datasource.url=jdbc:postgresql://${RENDER_DB_HOST:localhost}:${RENDER_DB_PORT:5432}/${RENDER_DB_NAME:task_tracker}
spring.datasource.username=${RENDER_DB_USERNAME:postgres}
spring.datasource.password=${RENDER_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Temporarily disable Flyway until DB is properly connected
spring.flyway.enabled=false

# Port configuration - Render assigns PORT environment variable
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:your_jwt_secret}
jwt.expiration=3600

# Logging for troubleshooting
logging.level.org.springframework=INFO
logging.level.com.tasktracker=DEBUG
logging.level.org.hibernate.SQL=DEBUG