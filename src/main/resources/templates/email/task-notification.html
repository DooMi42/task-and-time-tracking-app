<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Task Notification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #212529;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .header {
            background-color: #0d6efd;
            color: white;
            padding: 15px 30px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            margin: -30px -30px 20px -30px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 500;
        }

        .task-card {
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
        }

        .task-title {
            font-size: 18px;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 15px;
            color: #0d6efd;
        }

        .task-info {
            margin-bottom: 5px;
        }

        .task-label {
            font-weight: 500;
            display: inline-block;
            width: 100px;
        }

        .due-date {
            color: #dc3545;
            font-weight: 500;
        }

        .btn {
            display: inline-block;
            background-color: #0d6efd;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
            margin-top: 20px;
        }

        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
            font-size: 14px;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Task Tracker</h1>
        </div>

        <p>Hello, <strong th:text="${userName}">User</strong>!</p>
        <p>You have a new task notification:</p>

        <div class="task-card">
            <h2 class="task-title" th:text="${taskTitle}">Task Title</h2>

            <div class="task-info">
                <span class="task-label">Description:</span>
                <span th:text="${taskDescription}">Task Description</span>
            </div>

            <div class="task-info">
                <span class="task-label">Due Date:</span>
                <span class="due-date" th:text="${dueDate}">Due Date</span>
            </div>

            <a href="#" class="btn">View Task</a>
        </div>

        <div class="footer">
            <p>Thank you for using Task Tracker!</p>
            <p>If you have any questions, please contact our support team.</p>
        </div>
    </div>
</body>

</html>
