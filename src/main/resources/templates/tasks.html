<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Task Tracker - Tasks</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Task Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/tasks}">Tasks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/timeEntries}">Time Entries</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/perform_logout}" method="post">
                            <button type="submit" class="btn btn-link nav-link">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">Error message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>My Tasks</h2>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                <i class="bi bi-plus"></i> Add Task
            </button>
        </div>

        <div th:if="${tasks != null && !tasks.empty}">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <div class="col" th:each="task : ${tasks}">
                    <div class="card h-100" th:classappend="${task.completed} ? 'border-success' : ''">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${task.title}">Task Title</h5>
                            <p class="card-text" th:text="${task.description}">Description</p>
                            <p class="card-text">
                                <small class="text-muted">
                                    Due: <span th:text="${#temporals.format(task.dueDate, 'MMM dd, yyyy')}">Jun 15,
                                        2024</span>
                                </small>
                            </p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="badge bg-success" th:if="${task.completed}">Completed</span>
                                <span class="badge bg-warning" th:if="${!task.completed}">In Progress</span>
                                <div>
                                    <a th:href="@{/timeEntries(taskId=${task.id})}"
                                        class="btn btn-sm btn-outline-secondary">
                                        <i class="bi bi-clock"></i> Time Entries
                                    </a>
                                    <button class="btn btn-sm btn-outline-primary edit-task-btn"
                                        th:data-task-id="${task.id}" th:data-task-title="${task.title}"
                                        th:data-task-description="${task.description}"
                                        th:data-task-due-date="${#temporals.format(task.dueDate, 'yyyy-MM-dd')}"
                                        th:data-task-completed="${task.completed}">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <form class="d-inline" th:action="@{/api/tasks/{id}(id=${task.id})}" method="post">
                                        <input type="hidden" name="_method" value="DELETE">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Are you sure you want to delete this task?')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${tasks == null || tasks.empty}" class="alert alert-info">
            You don't have any tasks yet. Create one to get started!
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
            Error message will be displayed here
        </div>
    </div>

    <!-- Add Task Modal -->
    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/tasks/create}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Add New Task</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="dueDate" class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="dueDate" name="dueDate" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal fade" id="editTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="editTaskForm" method="post">
                    <input type="hidden" name="_method" value="PUT">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Task</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="editTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="editTitle" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="editDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="editDescription" name="description" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="editDueDate" class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="editDueDate" name="dueDate" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="editCompleted" name="completed">
                            <label class="form-check-label" for="editCompleted">Completed</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Set up edit task buttons
            document.querySelectorAll('.edit-task-btn').forEach(button => {
                button.addEventListener('click', function () {
                    const taskId = this.getAttribute('data-task-id');
                    const title = this.getAttribute('data-task-title');
                    const description = this.getAttribute('data-task-description');
                    const dueDate = this.getAttribute('data-task-due-date');
                    const completed = this.getAttribute('data-task-completed') === 'true';

                    document.getElementById('editTaskForm').action = `/api/tasks/${taskId}`;
                    document.getElementById('editTitle').value = title;
                    document.getElementById('editDescription').value = description;
                    document.getElementById('editDueDate').value = dueDate;
                    document.getElementById('editCompleted').checked = completed;

                    // Show the modal
                    new bootstrap.Modal(document.getElementById('editTaskModal')).show();
                });
            });
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const taskForm = document.getElementById('addTaskForm');
            if (taskForm) {
                taskForm.addEventListener('submit', function (e) {
                    // Format date if needed
                    const dueDateInput = document.getElementById('dueDate');
                    if (dueDateInput && dueDateInput.value) {
                        // Ensure date is in the format expected by your backend
                        const dueDate = new Date(dueDateInput.value);
                        console.log('Submitting due date:', dueDate.toISOString().split('T')[0]);
                    }
                });
            }
        });
    </script>
</body>

</html>
