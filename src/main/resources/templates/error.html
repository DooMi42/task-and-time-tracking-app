<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Error - Task Tracker</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="alert alert-danger">
            <h4 class="alert-heading">Error!</h4>
            <p th:if="${errorMessage}" th:text="${errorMessage}">An error occurred.</p>
            <p th:unless="${errorMessage}">An unexpected error occurred. Please try again later.</p>
        </div>
        <a href="/login" class="btn btn-primary">Return to Login</a>
    </div>
    <form th:action="@{/perform_logout}" method="post">
        <button type="submit" class="btn btn-link nav-link">Logout</button>
    </form>
</body>

</html>
