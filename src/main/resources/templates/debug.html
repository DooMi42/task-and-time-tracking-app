<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Task Tracker - Debug</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1>Debug Information</h1>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error message</div>

        <h2>All Tasks in Database</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>User</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="task : ${allTasks}">
                    <td th:text="${task.id}">1</td>
                    <td th:text="${task.title}">Task Title</td>
                    <td th:text="${task.user != null ? task.user.username : 'No User'}">username</td>
                    <td th:text="${task.status}">status</td>
                </tr>
            </tbody>
        </table>

        <a href="/tasks" class="btn btn-primary">Back to Tasks</a>
    </div>
</body>

</html>
