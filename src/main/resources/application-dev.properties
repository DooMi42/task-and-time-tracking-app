# application-dev.properties

# Development-specific configuration settings
spring.datasource.url=jdbc:mysql://localhost:3306/task_tracker_dev
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=mySecretKey
jwt.expiration=3600

# Email configuration
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging configuration
logging.level.org.springframework=INFO
logging.level.com.tasktracker=DEBUG

# Optional feature flags
feature.email-notifications=true
feature.task-reporting=true