# application-dev.properties

# Development-specific configuration settings
spring.datasource.url=jdbc:postgresql://localhost:5432/task_tracker_dev
spring.datasource.username=postgres
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=mySecretKey
jwt.expiration=3600

# Email configuration
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging configuration
logging.level.org.springframework=INFO
logging.level.com.tasktracker=DEBUG

# Optional feature flags
feature.email-notifications=true
feature.task-reporting=true